name: RUST CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Formatting
        run: cargo fmt -- --check --verbose

      - name: Linting
        run: cargo clippy 

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
